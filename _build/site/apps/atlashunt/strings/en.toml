label = "Atlas Hunt preview video"

[features]
heading = "Everything else"

[[features.items]]
heading = "Works offline"
text = "Every map and game works without the internet. Only the card's text and picture need it."

[[features.items]]
heading = "Six languages"
text = "English, Danish, Italian, Romanian, Russian and Ukrainian: choose in Settings, or follow your phone."

[[features.items]]
heading = "Fair to your fingers"
text = "A tiny country is a circle you can hit; a tap near the river you are asked for counts."

[[features.items]]
heading = "Achievements and leaderboards"
text = "With Google Play Games: perfect runs, daily streaks, Globetrotter, and leaderboards for every part of the world."

[[features.items]]
heading = "Your results, everywhere"
text = "Signed in, your results and trophies follow you to other devices."

[[features.items]]
heading = "Phones, tablets and PCs"
text = "On tablets, foldables and PCs the games and cards sit beside the map; zoom with the mouse wheel."

[plans]
heading = "Free, with a full version"

[plans.free]
name = "Free"
note = "No account needed"
items = [
    "Every game on every level",
    "Crosswords of 10 and 15 words",
    "A small ad while you pick a game, see your results or explore, never during a game or on a card",
]

[plans.full]
name = "Full version"
note = "One-time purchase in Google Play"
items = [
    "No ads",
    "Crosswords of 20, 30 and 50 words",
]

[privacy]
heading = "No account. No analytics of its own."
text = "The app itself collects nothing: your results stay on your phone, or in Google Play Games if you sign in. Cards ask Wikipedia and Wikimedia Commons for their text and picture. The free version's banner comes from Google AdMob, which asks for your consent first in the EEA, the UK and Switzerland."
link = "Read the privacy policy"

