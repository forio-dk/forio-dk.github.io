# Atlas Hunt page: English. Facts: ../atlas_hunt/docs/listings/en-US/listing.md. Every language has these keys.

[meta]
title = "Atlas Hunt: Map Quiz"
description = "Find countries, rivers and mountains on a map, then read about each one. Free for Android: 130+ map games in six languages, offline."
og_image_alt = "Atlas Hunt: find countries, rivers and mountains on a map, then read about each one"

[nav]
languages = "Language"

[hero]
lead = "Find countries, rivers and mountains on a map, then read about each one."
facts = "Free · 130+ games · Six languages · Works offline"
badge_alt = "Get it on Google Play"
alts = [
    "A Flags game: pick the country of a flag from four answers",
    "A game of the countries of Europe, each coloured by the try it took",
    "A game of the constellations of the night sky",
]

[how]
heading = "How it plays"
sub = "No labels, no hints: only the shapes of the countries, rivers and mountains."

[[how.steps]]
heading = "Pick a game, find each place"
text = "The game names a place; you find it on the map. A wrong tap shows what you touched; after the third miss the answer blinks."
alt = "The games of Europe: its countries, capitals, rivers, mountain ranges and more"

[[how.steps]]
heading = "Every place opens a card"
text = "Its picture and the start of its Wikipedia article, so you learn what it is, not only where."
alt = "The card of France: its flag, a picture of Paris and the start of its Wikipedia article"

[[how.steps]]
heading = "Go for a perfect run"
text = "Every name on the first try. Your best score and time are kept for each game."
alt = "The results of a game: the places found on the first try, and the time"

[levels]
heading = "A whole atlas to play"
sub = "130+ games on six levels, more on the way."

[[levels.items]]
key = "earth"
heading = "Earth"
text = "Countries, capitals, rivers, mountain ranges, lakes, seas, islands, deserts and peninsulas of every part of the world, and the regions of 30+ countries."

[[levels.items]]
key = "space"
heading = "Space"
text = "The planets, the moons of Mars, Jupiter, Saturn, Uranus and Neptune, the Moon's seas and craters, the constellations and brightest stars."

[[levels.items]]
key = "flags"
heading = "Flags"
text = "See a flag and pick its country from four answers: the World and six parts of it."

[[levels.items]]
key = "currencies"
heading = "Currencies"
text = "A currency's name and sign, such as won ₩: whose is it?"

[[levels.items]]
key = "crossword"
heading = "Crossword"
text = "Built from the places you pick, with clues from the atlas and a map hint for each. Share it as a PDF or a picture, or print it."

[[levels.items]]
key = "history"
heading = "History"
text = "The world as it was on 1 June 1816, in 1914 and in 1989."

