[meta]
title = "Atlas Hunt: Map Quiz"
description = "Quiz de geografie: găsește țări, capitale și râuri pe hartă. Și steagurile. Gratuit pentru Android: peste 130 de jocuri pe hărți, în șase limbi, offline."
