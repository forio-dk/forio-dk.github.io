text = "Jocul numește un loc, iar tu îl găsești pe hartă. O atingere greșită arată ce ai atins; după a treia greșeală răspunsul clipește."  # new
alt = "Jocurile Europei: țări, capitale, râuri, lanțuri muntoase și altele"  # new

