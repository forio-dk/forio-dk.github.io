# Russian: Слогарик. Facts: ../learn_to_read/docs/store/ru/listing.md; theme and game names: ../learn_to_read/app/src/ru/res/values/strings.xml.

[meta]
title = "Слогарик: читаем по слогам"
description = "Учимся читать по слогам: слоги, мемо, собери слово и раскраска для малышей. Бесплатно для Android, без регистрации."  # new
og_image_alt = "Слогарик: читаем по слогам, КО-РО-ВА, с картинками коровы, розы, груши и ракеты"  # new

[nav]
languages = "Язык"

[hero]
lead = "Учимся читать по слогам: слоги, мемо, собери слово и раскраска для малышей"
facts = "Бесплатно · Четыре игры · 14 тем · Без регистрации"  # new
badge_alt = "Скачать из Google Play"
shot_alt = "Темы: животные, цветы, фрукты, овощи, транспорт и букашки"  # new

[games]
heading = "Четыре игры"  # new
sub = "Четыре игры на одних и тех же словах."

[[games.items]]
key = "syllables"
heading = "Слоги"
text = "Слово разбито на слоги, над ним — картинка. Ребёнок читает слог за слогом и нажимает на слог, чтобы услышать его. Если размыть картинку в настройках, ребёнок проверяет себя, нажимая на неё."  # new
alt = "Слоги: слово, разбитое на слоги, под картинкой"  # new

[[games.items]]
key = "memo"
heading = "Мемо"
text = "Карточки с картинками и со словами лежат рубашкой вверх. Слово-карточка молчит — его надо прочитать; вслух произносится только найденная пара."  # new
alt = "Мемо: открыты карточка с картинкой и карточка со словом, остальные рубашкой вверх"  # new

[[games.items]]
key = "build"
heading = "Собери слово"
text = "Ребёнок перетаскивает слоги или буквы на пустые места под картинкой и видит, как складывается слово. Ошибка ничего не стоит."  # new
alt = "Собери слово: пустые места под картинкой и кусочки слова"  # new

[[games.items]]
key = "colouring"
heading = "Раскраска"
text = "Большая буква, цифра или фигура, которую можно раскрасить пальцем, и рядом — три картинки на эту букву."
alt = "Раскраска: большая буква и три картинки на неё"  # new

[themes]
heading = "Четырнадцать тем по десять слов"  # new
sub = "Все картинки нарисованы специально для приложения."
locked = "В полной версии"  # new

[themes.names]
animals = "Животные"
flowers = "Цветы"
fruits = "Фрукты"
vegetables = "Овощи"
transport = "Транспорт"
bugs = "Букашки"
