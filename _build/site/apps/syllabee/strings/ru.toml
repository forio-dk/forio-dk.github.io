kitchen = "Посуда"
tools = "Инструменты"
birds = "Птицы"
countries = "Страны"
mixed = "Вперемешку"

[themes.notes]
countries = "30 флагов; какие выпадают, выбирает взрослый"  # new
mixed = "Каждый раз новые слова"  # new

[colouring]
heading = "Раскраска"
sub = "Сюда можно прийти ещё до того, как ребёнок знает буквы."
shot_alt = "Раскраска фигуры: фигура, её название и три картинки"  # new
free = "Бесплатно"  # new

[[colouring.items]]
key = "letters"
heading = "Буквы"
text = "Раскрась букву, рядом — три картинки на неё. Английский алфавит — в полной версии."  # new

[[colouring.items]]
key = "numbers"
heading = "Цифры"
text = "Цифры с кубиками: посчитай точки."  # new

[[colouring.items]]
key = "shapes"
heading = "Фигуры"
text = "Девятнадцать фигур для раскрашивания."  # new

[[colouring.items]]
key = "math"
heading = "Математика"
text = "Десять картинок-раскрасок по цифрам: на каждом цвете — пример, голос читает его вслух. Числа до 10 или до 5."  # new

[video]
heading = "Посмотрите, как в него играют"  # new
text = "Темы, слоги, которые звучат, мемо, сборка слова, раскраска букв, цифр и фигур и настройки для взрослых: настоящая игра на телефоне."  # new
label = "Видеообзор Слогарика"  # new

[features]
heading = "И это ещё не всё"

[[features.items]]
heading = "Без очков, таймеров и звёзд"  # new
text = "За прочитанное слово — салют и весёлая мелодия, а не баллы."  # new

[[features.items]]
heading = "Нарисовано для приложения"  # new
text = "Все картинки нарисованы специально для приложения: 14 тем по десять слов и 30 флагов."  # new

[[features.items]]
heading = "Голос телефона"  # new
text = "Слова произносит голосовой движок телефона: для русских слов нужен русский голос, для английского алфавита — английский."  # new

[[features.items]]
heading = "Настройки для взрослых"  # new
text = "Размыть картинки, выбрать, сколько пар раскладывает «Мемо», как «Собери слово» делит слово, какие флаги выпадают в «Странах» и до скольки считает «Математика»."  # new

[[features.items]]
heading = "Ошибка ничего не стоит"  # new
text = "Кусочек просто остаётся там, где его отпустили."

[[features.items]]
heading = "Телефоны и планшеты"  # new
text = "Вертикально или горизонтально; на планшете, повёрнутом набок, картинка и слово стоят рядом."  # new

