[privacy]
heading = "Без регистрации. Никаких данных о ребёнке."  # new
text = "Само приложение ничего не собирает: нет аккаунтов, негде ввести имя, а настройки хранятся на устройстве. Баннер бесплатной версии показывает Google AdMob, и каждый запрос помечен как предназначенный для детей: без персонализированной рекламы и только реклама для всех возрастов."  # new
link = "Политика конфиденциальности (на английском)"

[cta]
