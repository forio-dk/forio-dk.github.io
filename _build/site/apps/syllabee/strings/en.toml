]

[privacy]
heading = "No sign-up. No data about your child."
text = "The app collects nothing itself: no accounts, nowhere to type a name, and its settings stay on the device. The free version's banner comes from Google AdMob, with every request marked as directed at children: no personalized ads, and only ads rated for all ages."
link = "Read the privacy policy"

