[meta]
title = "Складарик: читаємо по складах"
description = "Вчимося читати по складах: склади, мемо, збери слово й розмальовка для малят. Безкоштовно для Android, без реєстрації."  # new
og_image_alt = "Складарик: читаємо по складах, КО-РО-ВА, з малюнками корови, троянди, груші й ракети"  # new

[nav]
languages = "Мова"

[hero]
lead = "Вчимося читати по складах: склади, мемо, збери слово й розмальовка для малят"
facts = "Безкоштовно · Чотири гри · 14 тем · Без реєстрації"  # new
badge_alt = "Завантажити з Google Play"
shot_alt = "Теми: тварини, квіти, фрукти, овочі, транспорт і комашки"  # new

[games]
heading = "Чотири гри"  # new
sub = "Чотири гри на тих самих словах."

[[games.items]]
key = "syllables"
heading = "Склади"
text = "Слово поділене на склади, над ним — картинка. Дитина читає склад за складом і натискає на склад, щоб почути його. Якщо розмити картинку в налаштуваннях, дитина перевіряє себе, натискаючи на неї."  # new
alt = "Склади: слово, поділене на склади, під картинкою"  # new

[[games.items]]
key = "memo"
heading = "Мемо"
text = "Картки з картинками й зі словами лежать сорочкою догори. Картка зі словом мовчить — його треба прочитати; уголос звучить лише знайдена пара."  # new
alt = "Мемо: відкриті картка з картинкою і картка зі словом, решта сорочкою догори"  # new

[[games.items]]
key = "build"
heading = "Збери слово"
text = "Дитина перетягує склади або літери на порожні місця під картинкою й бачить, як складається слово. Помилка нічого не коштує."  # new
alt = "Збери слово: порожні місця під картинкою і шматочки слова"  # new

[[games.items]]
key = "colouring"
heading = "Розмальовка"
text = "Велика літера, цифра чи фігура, яку можна розфарбувати пальцем, і поруч — три картинки на цю літеру."
alt = "Розмальовка: велика літера і три картинки на неї"  # new

[themes]
heading = "Чотирнадцять тем по десять слів"  # new
sub = "Усі картинки намальовані спеціально для застосунку."
locked = "У повній версії"  # new

