[privacy]
heading = "Без реєстрації. Жодних даних про дитину."  # new
text = "Сам застосунок нічого не збирає: немає облікових записів, ніде ввести ім'я, а налаштування зберігаються на пристрої. Банер безкоштовної версії показує Google AdMob, і кожен запит позначено як призначений для дітей: без персоналізованої реклами й лише реклама для всіх вікових груп."  # new
