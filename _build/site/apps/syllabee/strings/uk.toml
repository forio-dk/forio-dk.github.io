sub = "Сюди можна прийти ще до того, як дитина знає літери."
shot_alt = "Розмальовка фігури: фігура, її назва і три картинки"  # new
free = "Безкоштовно"  # new

[[colouring.items]]
key = "letters"
heading = "Літери"
text = "Розфарбуй літеру, поруч — три картинки на неї. Англійська абетка — у повній версії."  # new

[[colouring.items]]
key = "numbers"
heading = "Цифри"
text = "Цифри з кубиками: порахуй крапки."  # new

[[colouring.items]]
key = "shapes"
heading = "Фігури"
text = "Дев'ятнадцять фігур для розфарбовування."  # new

[[colouring.items]]
key = "math"
heading = "Математика"
text = "Десять малюнків, які розфарбовують за цифрами: на кожному кольорі — приклад, голос читає його вголос. Числа до 10 або до 5."  # new

[video]
heading = "Подивіться, як у нього грають"  # new
text = "Теми, склади, які звучать, мемо, збирання слова, розмальовка літер, цифр і фігур і налаштування для дорослих: справжня гра на телефоні."  # new
label = "Відеоогляд Складарика"  # new

[features]
heading = "І це ще не все"

[[features.items]]
heading = "Без очок, таймерів і зірок"  # new
text = "За прочитане слово — салют і весела мелодія, а не бали."  # new

[[features.items]]
heading = "Намальовано для застосунку"  # new
text = "Усі картинки намальовані спеціально для застосунку: 14 тем по десять слів і 30 прапорів."  # new

[[features.items]]
heading = "Голос телефона"  # new
text = "Слова вимовляє голосовий рушій телефона: для українських слів потрібен український голос, для англійської абетки — англійський."  # new

[[features.items]]
heading = "Налаштування для дорослих"  # new
text = "Розмити картинки, вибрати, скільки пар розкладає «Мемо», як «Збери слово» ділить слово, які прапори випадають у «Країнах» і до скількох рахує «Математика»."  # new

[[features.items]]
heading = "Помилка нічого не коштує"  # new
text = "Шматочок просто лишається там, де його відпустили."

[[features.items]]
heading = "Телефони й планшети"  # new
text = "Вертикально чи горизонтально; на планшеті, повернутому набік, картинка і слово стоять поруч."  # new

