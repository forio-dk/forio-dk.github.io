[features]
heading = "Tot ce face"  # new

[[features.items]]
heading = "Peste 1000 de opere"  # new
text = "Fiecare cu titlu în limba română, din muzee din întreaga lume: Metropolitan Museum of Art, Luvru, Musée d'Orsay, Prado, National Gallery, Muzeul Național de Artă al României, Uffizi și multe altele."  # new

[[features.items]]
heading = "Wikipedia, la o atingere"  # new
text = "Fiecare nume este un link către articolul său de pe Wikipedia, care se deschide direct în aplicație, cu o scurtă introducere sub detalii."  # new

[[features.items]]
heading = "Imagine de fundal animată"  # new
text = "Fă din operă imaginea ta de fundal, pe tot ecranul, întunecată, estompată sau în gri cât dorești."  # new

[[features.items]]
heading = "Economizor de ecran"  # new
text = "În versiunea completă, opera apare cât timp telefonul se încarcă: singură, cu descrierea ei, cu un ceas sau deplasându-se încet pe ecran. Într-o cameră întunecată reduce luminozitatea."  # new

[[features.items]]
heading = "Opera următoare, cum vrei"  # new
text = "Dintr-un buton din Setări rapide sau ținând apăsat pe pictograma aplicației. Operele noi pot aștepta Wi-Fi-ul."  # new

[[features.items]]
heading = "12 limbi, funcționează offline"  # new
text = "Titlurile și detaliile funcționează fără internet; doar imaginea și introducerea din Wikipedia au nevoie de conexiune."  # new

