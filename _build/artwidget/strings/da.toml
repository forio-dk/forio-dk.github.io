alt = "Indstillinger med de typer kunstværker, der vises"  # new

[video]
heading = "Se den på under et minut"  # new
text = "En rundtur i widgetten, detaljerne og deres Wikipedia-artikler, zoom, den levende baggrund, feltet i Hurtige indstillinger og pauseskærmen."  # new
label = "Art Widgets præsentationsvideo"  # new

[features]
heading = "Alt, den kan"  # new

[[features.items]]
heading = "Over 1.000 værker"  # new
text = "Hvert med en dansk titel, fra museer i hele verden: Statens Museum for Kunst, Louvre, National Gallery, Metropolitan Museum of Art, Prado, Uffizi og mange flere."  # new

[[features.items]]
heading = "Wikipedia, et tryk væk"  # new
text = "Hvert navn er et link til artiklen på Wikipedia, som åbner direkte i appen, med en kort introduktion under detaljerne."  # new

[[features.items]]
heading = "Levende baggrund"  # new
text = "Gør værket til din baggrund, der fylder skærmen, dæmpet, sløret eller gråtonet, som du vil."  # new

[[features.items]]
heading = "Pauseskærm"  # new
text = "I den fulde version vises værket, mens telefonen oplader: alene, med billedtekst, med ur eller langsomt glidende hen over skærmen. I et mørkt rum dæmper den skærmen."  # new

[[features.items]]
heading = "Det næste værk, som du vil"  # new
text = "Fra Hurtige indstillinger eller ved at holde fingeren på appens ikon. Nye værker kan vente på Wi-Fi."  # new

[[features.items]]
heading = "12 sprog, virker offline"  # new
text = "Titler og detaljer virker uden internet; kun billedet og introduktionen fra Wikipedia kræver forbindelse."  # new

