text = "З українськими назвами, з музеїв усього світу: Лувру, Віденського музею історії мистецтв, Лондонської національної галереї, Прадо, Метрополітен-музею, Уффіці, Національного музею Тараса Шевченка та сотень інших."  # new

[[features.items]]
heading = "Вікіпедія в один дотик"  # new
text = "Кожне ім’я — посилання на статтю у Вікіпедії, яка відкривається просто в застосунку, а під відомостями — короткий вступ."  # new

[[features.items]]
heading = "Живі шпалери"  # new
text = "Твір може стати шпалерами на весь екран — із затемненням, розмиттям і знебарвленням на ваш смак."  # new

[[features.items]]
heading = "Заставка"  # new
text = "У повній версії твір показується, поки телефон заряджається: сам по собі, з підписом, з годинником або повільно пропливаючи екраном. У темній кімнаті заставка зменшує яскравість."  # new

[[features.items]]
heading = "Наступний — як зручно"  # new
text = "Із плитки швидких налаштувань або довгим натисканням на значок застосунку. Нові твори можуть чекати на Wi-Fi."  # new

[[features.items]]
heading = "12 мов, працює офлайн"  # new
text = "Назви й відомості доступні без інтернету; мережа потрібна лише для зображення та вступу з Вікіпедії."  # new

