[meta]
title = "Art Widget: Artwork of the Day"
description = "A famous work of art on your home screen, a different one every day. Free for Android, with 9,000+ works from the world's museums."
og_image_alt = "Art Widget: a famous work of art on your home screen, a different one every day"

[nav]
languages = "Language"

[hero]
lead = "A famous work of art on your home screen, a different one every day."
facts = "Free · Android 8 and newer · One-time purchase for the full version"
badge_alt = "Get it on Google Play"

[how]
heading = "A new masterpiece every day"
sub = "On your home screen, and on your lock screen where your phone allows it."

[[how.steps]]
heading = "It hangs on your home screen"
text = "A new work every 24 hours. Tap ↻ to see the next one at once."
alt = "The Art Widget widget on an Android home screen"

[[how.steps]]
heading = "Tap for the whole story"
text = "Title, artist, year, museum, city and size, and the work full screen."
alt = "The details of a work: title, artist, year, museum and city"

[[how.steps]]
heading = "Choose what you see"
text = "Paintings, sculptures, drawings, mosaics, tapestries and more."
alt = "Settings with the types of artwork to show"

[video]
heading = "See it in under a minute"
text = "A tour of the widget, the details and their Wikipedia articles, zooming in, the live wallpaper, the Quick Settings tile and the screensaver."
label = "Art Widget preview video"

[features]
heading = "Everything it does"

[[features.items]]
heading = "9,000+ works"
text = "Each with an English Wikipedia article, from the Louvre, the Hermitage, the National Gallery, the Metropolitan Museum of Art, the Prado, the Uffizi and hundreds more museums."

[[features.items]]
heading = "Wikipedia, one tap away"
text = "Every name links to its Wikipedia article, which opens right in the app, with a short introduction below the details."

[[features.items]]
heading = "Live wallpaper"
text = "Make the work your wallpaper, filling the screen, with as much dim, blur and grey as you like."

[[features.items]]
heading = "Screensaver"
text = "In the full version, the work shows while your phone charges: alone, with its caption, with a clock, or slowly panning. In a dark room it dims the screen."

[[features.items]]
heading = "The next work, your way"
text = "From a Quick Settings tile or by long-pressing the app icon. New works can wait for Wi-Fi."

[[features.items]]
heading = "12 languages, works offline"
text = "Titles and details work without the internet; only the image and the Wikipedia introduction need it."

